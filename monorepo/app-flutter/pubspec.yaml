name: app_flutter
description: Local Air Solutions — customer & technician app (role-based).
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.5.0

  # Networking
  dio: ^5.11.1

  # Environment variables
  flutter_dotenv: ^6.0.2

  # Routing
  go_router: ^18.1.4

  # Local storage
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.3
  image_picker: ^1.2.4
  intl: ^0.20.2
  cached_network_image: ^4.0.3
  image_cropper: ^12.2.1
  geolocator: ^14.1.2
  geocoding: ^5.0.1
  razorpay_flutter: ^1.4.7
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/

  # Uncomment and populate as assets are added:
  # - assets/images/
  # - assets/icons/
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/CustomFont-Regular.ttf
